<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cursed Decision Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>🧩 Cursed Decision Game</h1>

    <div class="stats">
      <p>Karma: <span id="karma">0</span></p>
      <p>FBI Suspicion: <span id="fbi">0</span></p>
      <p>Internet Clout: <span id="clout">0</span></p>
      <p>Chaos Level: <span id="chaos">1</span></p>
    </div>

    <div id="scenario" class="scenario"></div>
    <div id="choices" class="choices"></div>

    <button id="restart" onclick="restartGame()" style="display:none;">Restart Reality</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
